name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'   # nightly: catch newly-disclosed advisories via govulncheck

# Least privilege by default.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux' # harden-runner is Linux-only
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod verify
      - run: go vet ./...
      # Race detector + coverage threshold on Linux (the race detector needs a C toolchain on
      # Windows, and statement coverage is OS-independent); a plain test on macOS/Windows.
      - name: test (race) + coverage
        if: runner.os == 'Linux'
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { if (c+0 < 90) { print "coverage below the 90% minimum"; exit 1 } }'
      - name: test
        if: runner.os != 'Linux'
        run: go test ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Formatting. `go vet`, staticcheck and gosec don't look at formatting, so without this
      # step unformatted code merges silently. `gofmt -l` exits 0 even when it lists files, so
      # test the output, not the exit code; print the diff on failure so the fix is in the log.
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::unformatted files: $files"
            gofmt -d .
            exit 1
          fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 ./...
      - name: gosec (medium+)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -severity medium -confidence medium -quiet ./...
      # A ratchet, not a target. main.go reached 2374 lines holding ten unrelated jobs before
      # anyone noticed, because nothing ever failed while it grew. 30 sits just above today's worst
      # function (newExec at 28), so this passes now and refuses to let the number climb. The
      # average is 5.1, so ordinary code is nowhere near it and this will not fire on normal work.
      # Lowering the bar is its own task: simplify a function, then drop the number in the same
      # commit. Tests are excluded deliberately — a long table-driven test is not the complexity
      # this guards against, and counting them would push the threshold up past where it can bite.
      - name: gocyclo (no function over 30)
        run: |
          go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -over 30 -ignore '_test\.go' .
          echo "no function scored over 30"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 mod -licenses -json -output arca.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: arca.cdx.json

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Builds the real binary and drives it as a black box across all shipped OSes: full CLI
      # lifecycle, policy gates, fail-closed audit, and the MCP server over stdio. (sh-dependent
      # cases self-skip on Windows.)
      - run: go test -tags e2e ./e2e/...

  # The sync backend's CAS safety rests on S3 conditional writes (If-Match / If-None-Match).
  # The in-memory fake proves the client logic; this job proves the headers hold on a real
  # service, using MinIO in a container (docker run, not a service: MinIO needs a command).
  sync-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start MinIO
        run: |
          docker run -d --rm --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=arca-e2e -e MINIO_ROOT_PASSWORD=arca-e2e-secret \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "::error::MinIO did not become healthy" && exit 1
      - run: go test -tags sync_e2e -run TestSyncE2E -v ./
        env:
          ARCA_SYNC_E2E_ENDPOINT: 127.0.0.1:9000
          ARCA_SYNC_ACCESS_KEY: arca-e2e
          ARCA_SYNC_SECRET_KEY: arca-e2e-secret

  crossbuild:
    # Proves every release target compiles before we ever tag a release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /dev/null .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Secret scanning. arca is a secrets manager: a test fixture, doc example, or recipe that carries a
  # real credential is a plausible mistake with outsized blast radius, and git history makes it
  # permanent. Run via `go run tool@version` like the other linters above, so the tool is verified
  # through the Go checksum database and needs no marketplace action or license.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # scan history, not just the tip commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # --redact so a hit is reported without printing the matched credential into a public CI log.
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose --exit-code 1
