name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 3 * * 1'   # weekly Monday
  push:
    branches: [main]
  workflow_dispatch:        # allow on-demand runs (e.g. right after a release)

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout (job-level perms replace the workflow default)
      security-events: write  # upload SARIF to code scanning
      id-token: write         # publish results to the OpenSSF API
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # PAT (repo + admin:read) so the Branch-Protection check can read protection settings,
          # which the default GITHUB_TOKEN cannot.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
